<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UTE Eylem Planı</title>
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Eylem">
<script>
  (function () {
    var t; try { t = localStorage.getItem('ute_tema'); } catch (e) {}
    if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<style>
  :root {
    --bg: #FFFFFF; --text: #2C2C2A; --text2: #5F5E5A; --line: #D3D1C7; --weekend: #F4F8FD;
    --g-bg: #EAF3DE; --g-tx: #27500A;
    --b-bg: #E6F1FB; --b-tx: #0C447C;
    --r-bg: #FCEBEB; --r-tx: #791F1F;
    --mor-bg: #EEEDFE; --mor-tx: #3C3489;
    --turkuaz-bg: #E1F5EE; --turkuaz-tx: #085041;
    --mercan-bg: #FAECE7; --mercan-tx: #712B13;
    --pembe-bg: #FBEAF0; --pembe-tx: #72243E;
    --mavi-bg: #E6F1FB; --mavi-tx: #0C447C;
    --yesil-bg: #EAF3DE; --yesil-tx: #27500A;
    --kehribar-bg: #FAEEDA; --kehribar-tx: #633806;
    --gri-bg: #F1EFE8; --gri-tx: #444441;
    --mk1: rgba(239,159,39,0.45); --mk2: rgba(226,75,74,0.40);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #2C2C2A; --text: #F1EFE8; --text2: #B4B2A9; --line: #5F5E5A; --weekend: #33373C;
    --g-bg: #27500A; --g-tx: #C0DD97;
    --b-bg: #0C447C; --b-tx: #B5D4F4;
    --r-bg: #791F1F; --r-tx: #F7C1C1;
    --mor-bg: #3C3489; --mor-tx: #CECBF6;
    --turkuaz-bg: #085041; --turkuaz-tx: #9FE1CB;
    --mercan-bg: #712B13; --mercan-tx: #F5C4B3;
    --pembe-bg: #72243E; --pembe-tx: #F4C0D1;
    --mavi-bg: #0C447C; --mavi-tx: #B5D4F4;
    --yesil-bg: #27500A; --yesil-tx: #C0DD97;
    --kehribar-bg: #633806; --kehribar-tx: #FAC775;
    --gri-bg: #444441; --gri-tx: #D3D1C7;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px; font-weight: 400; line-height: 1.4;
  }
  button, input, select { font: inherit; color: inherit; }
  b, strong, h1, h2, h3 { font-weight: 500; }
  [hidden] { display: none !important; }
  .sec { color: var(--text2); font-size: 13px; }

  .app {
    max-width: 1100px; margin: 0 auto;
    padding: calc(8px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
             calc(24px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
  }
  .offline { margin: 0 0 8px; padding: 4px 0; font-size: 13px; color: var(--text2); border-bottom: 1px solid var(--line); text-align: center; }

  /* Düğmeler */
  .btn {
    min-height: 44px; padding: 0 14px; border: 1px solid var(--line); border-radius: 8px;
    background: transparent; cursor: pointer; white-space: nowrap; font-size: 15px;
  }
  .btn-primary { background: var(--text); color: var(--bg); border-color: var(--text); font-weight: 500; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn-danger { color: var(--r-tx); border-color: var(--r-tx); }
  .btn-danger-fill { background: var(--r-bg); color: var(--r-tx); border-color: var(--r-tx); font-weight: 500; }
  .link { min-height: 44px; padding: 0 4px; border: 0; background: transparent; color: var(--b-tx); cursor: pointer; font-size: 14px; text-decoration: underline; }
  .link:disabled { opacity: .45; cursor: default; }

  /* Başlık */
  .head { display: flex; align-items: center; gap: 8px; padding: 8px 0; }
  .head h1 { flex: 1; min-width: 0; margin: 0; font-size: 19px; line-height: 1.25; }

  /* Sayfa sekmeleri */
  .pages { display: flex; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
  .pages a {
    min-height: 44px; display: flex; align-items: center; padding: 0 16px; margin-bottom: -1px;
    color: var(--text2); text-decoration: none; border-bottom: 2px solid transparent; font-size: 16px;
  }
  .pages a[aria-current="page"] { color: var(--text); border-bottom-color: var(--text); font-weight: 500; }

  /* Kişi sekmeleri */
  .people { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
  .chip {
    min-height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid var(--text2);
    background: transparent; cursor: pointer; white-space: nowrap; font-size: 15px;
    display: inline-flex; align-items: center; gap: 8px; flex: none;
  }
  .chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); font-weight: 500; }
  .chip.add { color: var(--text2); border-color: var(--line); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: none; }

  /* Hafta seçici */
  .weeksel { display: flex; align-items: center; gap: 4px; margin: 8px 0 4px; }
  .weeksel button { width: 44px; height: 44px; border: 0; background: transparent; font-size: 26px; line-height: 1; cursor: pointer; border-radius: 8px; }
  .weeksel span { font-size: 16px; font-weight: 500; min-width: 120px; text-align: center; }

  /* Özet */
  .summary { font-size: 18px; margin: 4px 0 16px; }

  /* Etiketler */
  .tag { display: inline-block; padding: 3px 10px; border-radius: 6px; font-size: 15px; font-weight: 500; white-space: nowrap; }
  .g { background: var(--g-bg); color: var(--g-tx); }
  .b { background: var(--b-bg); color: var(--b-tx); }
  .r { background: var(--r-bg); color: var(--r-tx); }
  .k { background: var(--gri-bg); color: var(--gri-tx); }

  /* Kişi renkleri (Hafta şeritleri) */
  .p-mor { background: var(--mor-bg); color: var(--mor-tx); }
  .p-turkuaz { background: var(--turkuaz-bg); color: var(--turkuaz-tx); }
  .p-mercan { background: var(--mercan-bg); color: var(--mercan-tx); }
  .p-pembe { background: var(--pembe-bg); color: var(--pembe-tx); }
  .p-mavi { background: var(--mavi-bg); color: var(--mavi-tx); }
  .p-yesil { background: var(--yesil-bg); color: var(--yesil-tx); }
  .p-kehribar { background: var(--kehribar-bg); color: var(--kehribar-tx); }
  .p-gri { background: var(--gri-bg); color: var(--gri-tx); }

  /* Fosforlu kalem vurgusu */
  .mk {
    padding: 1px 5px; margin: 0 -5px;
    border-radius: 3px 11px 4px 13px / 10px 3px 11px 4px;
    -webkit-box-decoration-break: clone; box-decoration-break: clone;
  }
  .mk1 { background: var(--mk1); }
  .mk2 { background: var(--mk2); }

  /* SAYFA 1 — tablo */
  .trow, .thead { display: grid; grid-template-columns: 40px 1.2fr 1.4fr 1.1fr; }
  .thead > div { color: var(--text2); font-size: 13px; padding: 8px 8px 8px 0; }
  .trow { border-top: 1px solid var(--line); cursor: pointer; background: var(--bg); }
  .trow > div { padding: 16px 8px 16px 0; min-width: 0; }
  .trow.we { background: var(--weekend); }
  .trow .handle {
    display: flex; align-items: flex-start; justify-content: center; padding: 14px 0 0;
    color: var(--text2); font-size: 20px; line-height: 1; cursor: grab;
    touch-action: none; user-select: none; -webkit-user-select: none; min-height: 44px;
  }
  .kapali .trow .handle { visibility: hidden; }
  .trow .day { font-size: 16px; }
  .trow .name { font-size: 17px; font-weight: 500; overflow-wrap: anywhere; }
  .trow.done .name { color: var(--text2); }
  .trow .who { display: flex; align-items: center; gap: 6px; }
  .trow .why { margin-top: 4px; }
  .sortable-ghost { opacity: .4; }
  .empty { padding: 16px 0; color: var(--text2); font-size: 16px; margin: 0; }

  /* Açılır bölümler */
  .bolum { border-top: 1px solid var(--line); margin-top: 16px; }
  .bolum summary {
    list-style: none; min-height: 44px; display: flex; align-items: center; gap: 8px;
    font-size: 15px; font-weight: 500; cursor: pointer;
  }
  .bolum summary::-webkit-details-marker { display: none; }
  .bolum .chev { display: inline-block; transition: transform .15s; color: var(--text2); }
  .bolum[open] .chev { transform: rotate(180deg); }
  .bolum .link { margin: 4px 0 0 32px; }

  /* SAYFA 2 — Hafta */
  .weekwrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .week {
    display: grid; grid-template-columns: repeat(7, minmax(96px, 1fr)); min-width: 672px;
    row-gap: 6px; padding-bottom: 12px;
  }
  .week .colbg { grid-row: 1 / -1; }
  .week .colbg.we { background: var(--weekend); }
  .week .dh { grid-row: 1; padding: 10px 6px; border-bottom: 1px solid var(--line); text-align: center; }
  .week .dh b { display: block; font-size: 17px; }
  .strip {
    position: relative; z-index: 1; margin: 0 3px; min-height: 44px; padding: 6px 10px;
    border: 0; border-radius: 6px; text-align: left; cursor: pointer; font-size: 15px; line-height: 1.3;
    overflow-wrap: anywhere;
  }
  .strip.cutL { margin-left: 0; border-top-left-radius: 0; border-bottom-left-radius: 0; padding-left: 14px;
    clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 6px 80%, 0 60%, 6px 40%, 0 20%, 6px 0); }
  .strip.cutR { margin-right: 0; border-top-right-radius: 0; border-bottom-right-radius: 0; padding-right: 14px;
    clip-path: polygon(0 0, 100% 0, calc(100% - 6px) 20%, 100% 40%, calc(100% - 6px) 60%, 100% 80%, calc(100% - 6px) 100%, 0 100%); }
  .strip.cutL.cutR { clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 20%, 100% 40%, calc(100% - 6px) 60%, 100% 80%, calc(100% - 6px) 100%, 0 100%, 6px 80%, 0 60%, 6px 40%, 0 20%); }

  /* Alt satır */
  .foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-top: 20px; padding-top: 12px; border-top: 1px solid var(--line); }
  .legend { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; font-size: 13px; color: var(--text2); }
  .legend .tag { font-size: 13px; }
  .legend .mk { color: var(--text); margin: 0; }
  .legend .pl { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 6px; }
  .exports { display: flex; gap: 8px; }
  .note { font-size: 13px; color: var(--text2); width: 100%; margin: 0; }

  /* Anahtar ekranı */
  .keyscreen { max-width: 420px; margin: 0 auto; padding: calc(48px + env(safe-area-inset-top)) 16px 24px; }
  .keyscreen h1 { font-size: 19px; margin: 0 0 8px; }
  .keyscreen p { color: var(--text2); margin: 0 0 16px; }

  /* Form */
  .field { margin-bottom: 16px; }
  .field label, .flabel { display: block; font-size: 14px; color: var(--text2); margin-bottom: 6px; }
  .lrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .lrow label { margin-bottom: 0; }
  .field input[type="text"], .field input[type="date"], .field select, .keyscreen input, .kadd input[type="text"] {
    width: 100%; min-height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); font-size: 16px;
  }
  .field input[type="date"] { -webkit-appearance: none; appearance: none; display: flex; align-items: center; }
  .selwrap { position: relative; }
  .selwrap .dot { position: absolute; left: 14px; top: 50%; margin-top: -4px; pointer-events: none; }
  .selwrap select { padding-left: 30px !important; }
  input:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible, .trow:focus-visible, summary:focus-visible {
    outline: 2px solid var(--b-tx); outline-offset: 2px;
  }
  .err { margin: 4px 0 0; font-size: 13px; color: var(--r-tx); }
  .err:empty { display: none; }
  input[type="checkbox"] { width: 22px; height: 22px; margin: 0; accent-color: var(--text); }
  fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }

  /* Paneller */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 20; }
  .panel {
    position: fixed; top: 0; right: 0; bottom: 0; width: 440px; max-width: 100%;
    background: var(--bg); border-left: 1px solid var(--line); z-index: 21;
    display: flex; flex-direction: column;
  }
  .p-head { display: flex; align-items: center; gap: 8px; padding: calc(8px + env(safe-area-inset-top)) 16px 8px; border-bottom: 1px solid var(--line); }
  .p-head h2 { flex: 1; margin: 0; font-size: 19px; }
  .p-body { flex: 1; overflow-y: auto; padding: 16px; -webkit-overflow-scrolling: touch; }
  .p-foot { padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--bg); }
  .p-foot .row { display: flex; gap: 8px; }
  .p-foot .grow { flex: 1; }
  .p-foot p { margin: 0 0 8px; }
  .subs { list-style: none; margin: 0; padding: 0; }
  .sub { display: flex; align-items: center; gap: 4px; border-bottom: 1px solid var(--line); }
  .sub .cb { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; flex: none; cursor: pointer; }
  .sub input[type="text"] { flex: 1; min-width: 0; min-height: 44px; border: 0; background: transparent; font-size: 16px; padding: 0 4px; }
  .sub .x { width: 44px; height: 44px; flex: none; border: 0; background: transparent; font-size: 22px; color: var(--text2); cursor: pointer; border-radius: 8px; }
  .addsub { width: 100%; min-height: 44px; border: 0; background: transparent; text-align: left; padding: 0 12px; color: var(--text2); cursor: pointer; font-size: 15px; }
  .check { display: flex; align-items: center; gap: 12px; min-height: 44px; cursor: pointer; font-size: 16px; font-weight: 500; }

  /* Kişiler paneli */
  .klist { list-style: none; margin: 0; padding: 0; }
  .krow { border-bottom: 1px solid var(--line); padding: 4px 0; }
  .kline { display: flex; align-items: center; gap: 10px; }
  .kline .dot { width: 12px; height: 12px; }
  .kname { flex: 1; min-width: 0; min-height: 44px; border: 0; border-bottom: 1px solid transparent; background: transparent; font-size: 16px; padding: 0 4px; }
  .kname:focus { border-bottom-color: var(--text); outline: none; }
  .kmsg { margin: 0 0 8px 22px; font-size: 14px; color: var(--r-tx); }
  .kconfirm { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 0 8px 22px; font-size: 15px; }
  .kconfirm span { flex: 1 0 100%; }
  .kadd .flabel { margin-bottom: 8px; }
  .swatches { display: flex; margin: 8px 0; }
  .sw { flex: 1; min-width: 0; height: 44px; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
  .sw span { width: 28px; height: 28px; border-radius: 50%; display: block; }
  .sw[aria-pressed="true"] span { outline: 2px solid var(--text); outline-offset: 2px; }

  @media (max-width: 719px) {
    .panel { width: 100%; border-left: 0; }
  }
  @media (min-width: 720px) {
    .app { padding-top: calc(16px + env(safe-area-inset-top)); }
  }

  /* PDF (yazdırma) — her zaman gündüz renkleri */
  #print { display: none; }
  @media print {
    @page { size: A4 landscape; margin: 10mm; }
    :root {
      --bg: #FFFFFF !important; --text: #2C2C2A !important; --text2: #5F5E5A !important;
      --line: #D3D1C7 !important; --weekend: #F4F8FD !important;
      --g-bg: #EAF3DE !important; --g-tx: #27500A !important;
      --b-bg: #E6F1FB !important; --b-tx: #0C447C !important;
      --r-bg: #FCEBEB !important; --r-tx: #791F1F !important;
      --mor-bg: #EEEDFE !important; --mor-tx: #3C3489 !important;
      --turkuaz-bg: #E1F5EE !important; --turkuaz-tx: #085041 !important;
      --mercan-bg: #FAECE7 !important; --mercan-tx: #712B13 !important;
      --pembe-bg: #FBEAF0 !important; --pembe-tx: #72243E !important;
      --mavi-bg: #E6F1FB !important; --mavi-tx: #0C447C !important;
      --yesil-bg: #EAF3DE !important; --yesil-tx: #27500A !important;
      --kehribar-bg: #FAEEDA !important; --kehribar-tx: #633806 !important;
      --gri-bg: #F1EFE8 !important; --gri-tx: #444441 !important;
    }
    body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .app, .keyscreen, .overlay, .panel { display: none !important; }
    #print { display: block; }
    #print h1 { font-size: 19px; margin: 0 0 8px; }
    #print h2 { font-size: 15px; margin: 16px 0 4px; }
    #print .pbreak { break-before: page; }
    #print .week { min-width: 0; }
    #print .weekwrap { overflow: visible; }
    #print .trow { break-inside: avoid; }
    #print .handle { visibility: hidden; }
  }
</style>
</head>
<body>

<!-- Anahtar ekranı (ilk açılış) -->
<section class="keyscreen" id="keyScreen" hidden>
  <h1>Haftalık eylem planı</h1>
  <p id="keyMsg">Erişim anahtarını yaz. Bu cihazda bir kez sorulur.</p>
  <form id="keyForm">
    <div class="field">
      <label for="keyInput">Anahtar</label>
      <input id="keyInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">
    </div>
    <button class="btn btn-primary" type="submit" style="width:100%">Devam</button>
  </form>
</section>

<div class="app" id="app">
  <p class="offline" id="offline" hidden>Çevrimdışı – son kayıtlı hâl</p>

  <header class="head">
    <h1>Haftalık eylem planı</h1>
    <button class="btn" id="themeBtn" type="button"></button>
    <button class="btn btn-primary" id="newBtn" type="button">+ Yeni görev</button>
  </header>

  <nav class="pages" aria-label="Sayfalar">
    <a href="#bugun" id="tabBugun">Bugün</a>
    <a href="#hafta" id="tabHafta">Hafta</a>
  </nav>

  <div class="people" id="people" role="group" aria-label="Kişi"></div>

  <div class="weeksel">
    <button type="button" id="prevWeek" aria-label="Önceki hafta">‹</button>
    <span id="weekLabel"></span>
    <button type="button" id="nextWeek" aria-label="Sonraki hafta">›</button>
  </div>

  <p class="summary" id="summary" aria-live="polite"></p>

  <main id="content"></main>

  <footer class="foot">
    <div class="legend" id="legend"></div>
    <div class="exports">
      <button class="btn" id="pdfBtn" type="button">PDF</button>
      <button class="btn" id="xlsBtn" type="button">Excel</button>
    </div>
    <p class="note" id="exportMsg" hidden></p>
  </footer>
</div>

<div class="overlay" id="overlay" hidden></div>

<!-- Görev detay paneli -->
<aside class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="pTitle" hidden>
  <div class="p-head">
    <h2 id="pTitle">Görev</h2>
    <button class="btn" type="button" data-kapat>Kapat</button>
  </div>
  <div class="p-body">
    <fieldset id="pFields">
      <div class="field">
        <label for="fAd">Görev adı</label>
        <input id="fAd" type="text" autocomplete="off">
        <p class="err" id="eAd"></p>
      </div>
      <div class="field">
        <label for="fSorumlu">Sorumlu</label>
        <div class="selwrap"><span class="dot" id="fSorumluDot"></span><select id="fSorumlu"></select></div>
        <p class="err" id="eSorumlu"></p>
      </div>
      <div class="field">
        <label for="fBel">Görev belirleme tarihi</label>
        <input id="fBel" type="date">
        <p class="err" id="eBel"></p>
      </div>
      <div class="field">
        <div class="lrow">
          <label for="fBas">Başlangıç tarihi (isteğe bağlı)</label>
          <button type="button" class="link" data-temizle="fBas">Temizle</button>
        </div>
        <input id="fBas" type="date">
        <p class="err" id="eBas"></p>
      </div>
      <div class="field">
        <div class="lrow">
          <label for="fBit">Bitiş tarihi (isteğe bağlı)</label>
          <button type="button" class="link" data-temizle="fBit">Temizle</button>
        </div>
        <input id="fBit" type="date">
        <p class="err" id="eBit"></p>
      </div>
      <div class="field">
        <span class="flabel" id="subsLabel">Alt görevler</span>
        <ul class="subs" id="subs" aria-labelledby="subsLabel"></ul>
        <button type="button" class="addsub" id="addSub">+ Alt görev ekle</button>
      </div>
      <div class="field">
        <label for="fDurum">Durum</label>
        <select id="fDurum"></select>
      </div>
      <label class="check"><input type="checkbox" id="fBitti"> Bitti</label>
    </fieldset>
  </div>
  <div class="p-foot">
    <div id="footNormal">
      <p class="err" id="eSave"></p>
      <div class="row">
        <button class="btn btn-primary grow" id="pSave" type="button">Kaydet</button>
        <button class="btn btn-danger" id="pDel" type="button">Sil</button>
      </div>
    </div>
    <div id="footConfirm" hidden>
      <p>Bu görev silinsin mi?</p>
      <div class="row">
        <button class="btn btn-danger-fill grow" id="pDelYes" type="button">Evet, sil</button>
        <button class="btn" id="pDelNo" type="button">Vazgeç</button>
      </div>
    </div>
  </div>
</aside>

<!-- Kişiler paneli -->
<aside class="panel" id="kPanel" role="dialog" aria-modal="true" aria-labelledby="kTitle" hidden>
  <div class="p-head">
    <h2 id="kTitle">Kişiler</h2>
    <button class="btn" type="button" data-kapat>Kapat</button>
  </div>
  <div class="p-body">
    <ul class="klist" id="kList"></ul>
    <p class="err" id="kListErr"></p>
  </div>
  <div class="p-foot kadd">
    <fieldset id="kFields">
      <label class="flabel" for="kAd">+ Kişi ekle</label>
      <input id="kAd" type="text" autocomplete="off" placeholder="Ad">
      <div class="swatches" id="kRenk" role="group" aria-label="Renk"></div>
      <p class="err" id="kErr"></p>
      <button class="btn btn-primary" id="kSave" type="button" style="width:100%">Kaydet</button>
    </fieldset>
  </div>
</aside>

<div id="print"></div>

<script>
// ── Ayar: Apps Script web uygulaması adresi ──
const API = "https://script.google.com/macros/s/AKfycbyG35QpkX98ziEZ1j7HTTZGB22QtkWny18PzohA0dlxXKof88rWcPyr8NdaEae0C2NvKA/exec";
// ─────────────────────────────────────────────

const XLSX_URL = 'https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js';
const LS = { key: 'ute_anahtar', data: 'ute_veri', theme: 'ute_tema', bolum: 'ute_bolum' };
const AYLAR = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
const AY_EK = ["'da","'da","'da","'te","'da","'da","'de","'da","'de","'de","'ta","'da"]; // 18 Kas'ta
const GUNLER = ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
const KISA_GUN = ['Paz','Pzt','Sal','Çar','Per','Cum','Cmt'];
const TUMU = 'Tümü';
const DURUMLAR = ['Başlamadı', 'Başladı', 'Devam ediyor'];
// Kişi renkleri: [gündüz zemin, gündüz yazı]
const RENK = {
  'mor': ['EEEDFE', '3C3489'], 'turkuaz': ['E1F5EE', '085041'], 'mercan': ['FAECE7', '712B13'], 'pembe': ['FBEAF0', '72243E'],
  'mavi': ['E6F1FB', '0C447C'], 'yeşil': ['EAF3DE', '27500A'], 'kehribar': ['FAEEDA', '633806'], 'gri': ['F1EFE8', '444441']
};
const RENK_ADLARI = Object.keys(RENK);
const slug = r => (r === 'yeşil' ? 'yesil' : (RENK[r] ? r : 'gri'));
const HATA = {
  kisi_var: 'Bu adla bir kişi zaten var.', kisi_ad: 'Bir ad yaz.', renk: 'Bir renk seç.',
  sorumlu: 'Sorumlu kişi listede yok.', tarih: 'Tarihleri kontrol et.', eksik: 'Görev adı gerekli.'
};

const $ = id => document.getElementById(id);
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const lsDel = k => { try { localStorage.removeItem(k); } catch (e) {} };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

// ── Tarih yardımcıları ("YYYY-MM-DD") ──
const pad = n => String(n).padStart(2, '0');
const toStr = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const toDate = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const bugunStr = () => toStr(new Date());
const gunEkle = (s, n) => { const d = toDate(s); d.setDate(d.getDate() + n); return toStr(d); };
const gunFarki = (a, b) => Math.round((toDate(b) - toDate(a)) / 864e5);
const pazartesi = s => { const d = toDate(s); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return toStr(d); };
const kisaTarih = s => { const d = toDate(s); return d.getDate() + ' ' + AYLAR[d.getMonth()]; };
const gunAdi = s => GUNLER[toDate(s).getDay()];
const haftaSonu = s => { const g = toDate(s).getDay(); return g === 5 || g === 6; }; // Cuma, Cumartesi

function ek(n) { // 1'i, 2'si, 3'ü, 6'sı, 10'u …
  if (n === 0) return "'ı";
  if (n % 1000 === 0) return "'i";
  if (n % 100 === 0) return "'ü";
  const b = n % 10, o = Math.floor(n / 10) % 10;
  if (b) return ["", "'i", "'si", "'ü", "'ü", "'i", "'sı", "'si", "'i", "'u"][b];
  return ["", "'u", "'si", "'u", "'ı", "'si", "'ı", "'i", "'i", "'ı"][o];
}

// ── Durum ──
let bolumAcik = {};
try { bolumAcik = JSON.parse(lsGet(LS.bolum) || '{}') || {}; } catch (e) {}

const state = {
  gorevler: [],
  kisiler: [],
  kisi: TUMU,
  hafta: pazartesi(bugunStr()),
  offline: false,
  taslak: null,
  bitenTumu: false,
  kRenk: null,
  kMesaj: null,
  istekNo: 0
};

function normal(g) {
  return {
    id: String(g.id), ad: String(g.ad || ''), sorumlu: String(g.sorumlu || ''),
    belirleme_tarihi: g.belirleme_tarihi || '', baslangic: g.baslangic || '', bitis: g.bitis || '',
    bitti: g.bitti === true, bitirme_tarihi: g.bitirme_tarihi || '', sira: Number(g.sira) || 0,
    durum: DURUMLAR.includes(g.durum) ? g.durum : DURUMLAR[0],
    alt_gorevler: Array.isArray(g.alt_gorevler) ? g.alt_gorevler.map(a => ({ ad: String(a.ad || ''), bitti: !!a.bitti })) : []
  };
}

function veriUygula(j, kaydet) {
  state.gorevler = (j.gorevler || []).map(normal);
  if (Array.isArray(j.kisiler)) {
    state.kisiler = j.kisiler.map(k => typeof k === 'string' ? { ad: k, renk: 'gri' } : { ad: String(k.ad), renk: RENK[k.renk] ? k.renk : 'gri' });
  }
  if (state.kisi !== TUMU && !state.kisiler.some(k => k.ad === state.kisi)) state.kisi = TUMU;
  if (kaydet) lsSet(LS.data, JSON.stringify({ gorevler: state.gorevler, kisiler: state.kisiler }));
  ciz();
}

const kisiRengi = ad => { const k = state.kisiler.find(x => x.ad === ad); return k ? k.renk : 'gri'; };
const nokta = ad => '<span class="dot" style="background:#' + RENK[kisiRengi(ad)][1] + '"></span>';

// ── Görev hesapları ──
const basla = g => g.baslangic || g.belirleme_tarihi;
const siraIle = (a, b) => a.sira - b.sira || a.ad.localeCompare(b.ad, 'tr');
const buHaftaMi = () => state.hafta === pazartesi(bugunStr());

function etiket(g) {
  const t = bugunStr();
  if (g.bitti) {
    const b = g.bitirme_tarihi;
    return { cls: 'g', ad: 'Bitti', neden: b ? kisaTarih(b) + AY_EK[toDate(b).getMonth()] + ' bitti' : 'Bitti', gecikme: 0 };
  }
  if (!g.bitis) return { cls: 'k', ad: 'Planla', neden: g.durum + ' · tarih yok', gecikme: 0 };
  if (g.bitis < t) {
    const x = gunFarki(g.bitis, t);
    return { cls: 'r', ad: 'Bugün yap', neden: g.durum + ' · ' + x + ' gün gecikti', gecikme: x };
  }
  return { cls: 'b', ad: 'Yapılacak', neden: g.durum + ' · son gün ' + kisaTarih(g.bitis), gecikme: 0 };
}

function listeler() {
  const t = bugunStr(), pzt = state.hafta, paz = gunEkle(pzt, 6), bu = buHaftaMi();
  const hepsi = state.gorevler.filter(g => state.kisi === TUMU || g.sorumlu === state.kisi);
  const planli = hepsi.filter(g => !g.bitti && g.bitis);
  const haftada = g => basla(g) <= paz && g.bitis >= pzt;
  const bitenTum = hepsi.filter(g => g.bitti)
    .sort((a, b) => (b.bitirme_tarihi || '').localeCompare(a.bitirme_tarihi || '') || siraIle(a, b));
  const sinir = gunEkle(t, -30);
  return {
    plan: planli.filter(g => haftada(g) || g.bitis < t).sort(siraIle),          // tablo: haftanın işleri + tüm gecikenler
    hafta: planli.filter(g => haftada(g) || (bu && g.bitis < t)).sort(siraIle), // şeritler
    tarihsiz: hepsi.filter(g => !g.bitti && !g.bitis).sort(siraIle),
    biten: state.bitenTumu ? bitenTum : bitenTum.filter(g => (g.bitirme_tarihi || '') >= sinir),
    bitenTum,
    bitenHafta: bitenTum.filter(g => g.bitirme_tarihi >= pzt && g.bitirme_tarihi <= paz).length
  };
}

function haftaEtiket() {
  const a = toDate(state.hafta), b = toDate(gunEkle(state.hafta, 6));
  return a.getMonth() === b.getMonth()
    ? a.getDate() + '–' + b.getDate() + ' ' + AYLAR[b.getMonth()]
    : a.getDate() + ' ' + AYLAR[a.getMonth()] + ' – ' + b.getDate() + ' ' + AYLAR[b.getMonth()];
}

function ozet(L) {
  const t = bugunStr();
  const bas = buHaftaMi() ? 'Bu hafta' : 'Seçili haftada';
  const tz = L.tarihsiz.length;
  const planla = tz ? '<b>' + tz + '</b> tarihsiz işi planla.' : 'yeni işleri planla.';
  const n = L.plan.length + L.bitenHafta, d = L.bitenHafta;
  const gec = L.plan.filter(g => g.bitis < t).length;
  const bugun = L.plan.filter(g => g.bitis === t).length;
  if (!n) return tz ? bas + ' planlı iş yok; ' + planla : bas + ' iş yok; <b>+ Yeni görev</b> ile iş ekle.';
  if (d === n) return bas + ' <b>' + n + '</b> işin hepsi bitti; ' + planla;
  const giris = bas + ' <b>' + n + '</b> işin <b>' + d + ek(d) + '</b> bitti; ';
  if (gec) return giris + '<b>' + gec + '</b> iş gecikti, bugün ' + (gec > 1 ? 'onları' : 'onu') + ' bitir.';
  if (bugun) return giris + 'gecikme yok, bugün <b>' + bugun + '</b> işin son günü.';
  const s = L.plan[0];
  return giris + 'gecikme yok, sıradaki iş: <b>' + esc(s.ad) + '</b> (son gün ' + kisaTarih(s.bitis) + ').';
}

// ── Çizim ──
function satirHTML(g, tur) {
  const e = etiket(g);
  const cls = 'trow' + (g.bitis && haftaSonu(g.bitis) ? ' we' : '') + (tur === 'biten' ? ' done' : '');
  const tutamac = tur === 'biten' ? '<div></div>' : '<div class="handle" aria-hidden="true" title="Sürükleyerek sırala">⠿</div>';
  const tarih = g.bitis
    ? '<div class="day">' + kisaTarih(g.bitis) + '</div><div class="sec">' + gunAdi(g.bitis) + '</div>'
    : '<div class="day">—</div>';
  const ad = e.gecikme ? '<span class="mk ' + (e.gecikme >= 2 ? 'mk2' : 'mk1') + '">' + esc(g.ad) + '</span>' : esc(g.ad);
  return '<div class="' + cls + '" role="row" tabindex="0" data-id="' + esc(g.id) + '">' + tutamac +
    '<div role="cell">' + tarih + '</div>' +
    '<div role="cell"><div class="name">' + ad + '</div><div class="sec who">' + nokta(g.sorumlu) + esc(g.sorumlu) + '</div></div>' +
    '<div role="cell"><span class="tag ' + e.cls + '">' + e.ad + '</span><div class="sec why">' + esc(e.neden) + '</div></div></div>';
}

function tabloHTML(list, tur, bos, baslikli) {
  const head = baslikli
    ? '<div class="thead" role="row"><div></div><div role="columnheader">Bitiş</div><div role="columnheader">Görev</div><div role="columnheader">Talimat</div></div>'
    : '';
  return '<div role="table"' + (state.offline ? ' class="kapali"' : '') + '>' + head +
    '<div class="tbody" data-liste="' + tur + '">' + list.map(g => satirHTML(g, tur)).join('') + '</div>' +
    (list.length ? '' : '<p class="empty">' + bos + '</p>') + '</div>';
}

function bolumHTML(id, baslik, n, ic) {
  return '<details class="bolum" data-bolum="' + id + '"' + (bolumAcik[id] ? ' open' : '') + '>' +
    '<summary><span>' + baslik + ' (' + n + ')</span><span class="chev" aria-hidden="true">⌄</span></summary>' + ic + '</details>';
}

function bugunHTML(L) {
  const bitenIc = tabloHTML(L.biten, 'biten', 'Son 30 günde biten iş yok.', false) +
    (!state.bitenTumu && L.bitenTum.length > L.biten.length ? '<button type="button" class="link" id="tumunuGoster">Tümünü göster</button>' : '');
  return tabloHTML(L.plan, 'plan', 'Bu hafta planlı iş yok.', true) +
    bolumHTML('tarihsiz', 'Tarihsiz', L.tarihsiz.length, tabloHTML(L.tarihsiz, 'tarihsiz', 'Tarihsiz iş yok.', false)) +
    bolumHTML('biten', 'Biten', L.bitenTum.length, bitenIc);
}

function serit(g) {
  const pzt = state.hafta, paz = gunEkle(pzt, 6), b = basla(g);
  const s = b < pzt ? 0 : gunFarki(pzt, b);
  let e = g.bitis > paz ? 6 : gunFarki(pzt, g.bitis);
  if (g.bitis < pzt) e = Math.min(6, Math.max(0, gunFarki(pzt, bugunStr()))); // önceki haftadan kalan geciken iş
  return { s, e, cutL: b < pzt, cutR: g.bitis > paz };
}

function haftaHTML(list) {
  const pzt = state.hafta;
  let h = '';
  for (let i = 0; i < 7; i++) {
    const gun = gunEkle(pzt, i);
    h += '<div class="colbg' + (haftaSonu(gun) ? ' we' : '') + '" style="grid-column:' + (i + 1) + '"></div>';
    h += '<div class="dh" style="grid-column:' + (i + 1) + '"><b>' + toDate(gun).getDate() + '</b><span class="sec">' + KISA_GUN[toDate(gun).getDay()] + '</span></div>';
  }
  list.forEach((g, i) => {
    const e = etiket(g), p = serit(g);
    const cls = 'strip p-' + slug(kisiRengi(g.sorumlu)) + (p.cutL ? ' cutL' : '') + (p.cutR ? ' cutR' : '');
    const ad = e.gecikme ? '<span class="mk ' + (e.gecikme >= 2 ? 'mk2' : 'mk1') + '">' + esc(g.ad) + '</span>' : esc(g.ad);
    h += '<button type="button" class="' + cls + '" data-id="' + esc(g.id) + '" style="grid-column:' + (p.s + 1) + ' / ' + (p.e + 2) + ';grid-row:' + (i + 2) + '"' +
      ' aria-label="' + esc(g.ad + ', ' + g.sorumlu + ', ' + e.ad + ', ' + e.neden) + '">' + ad + '</button>';
  });
  return '<div class="weekwrap"><div class="week" style="grid-template-rows:auto' + (list.length ? ' repeat(' + list.length + ', auto)' : '') + '">' + h + '</div></div>' +
    (list.length ? '' : '<p class="empty">Bu hafta planlı iş yok.</p>');
}

function legendHTML(sayfa) {
  const mk = '<span><span class="mk mk1">1 gün gecikti</span></span><span><span class="mk mk2">2+ gün gecikti</span></span>';
  if (sayfa === 'hafta') {
    return state.kisiler.map(k => '<span class="pl p-' + slug(k.renk) + '">' + esc(k.ad) + '</span>').join('') + mk;
  }
  return '<span class="tag b">Yapılacak</span><span class="tag r">Bugün yap</span><span class="tag k">Planla</span><span class="tag g">Bitti</span>' + mk;
}

const sayfa = () => location.hash === '#hafta' ? 'hafta' : 'bugun';
let siralayicilar = [];

function ciz() {
  const tema = document.documentElement.getAttribute('data-theme');
  $('themeBtn').textContent = tema === 'dark' ? 'Gündüz' : 'Gece';
  $('themeBtn').setAttribute('aria-label', tema === 'dark' ? 'Gündüz moduna geç' : 'Gece moduna geç');

  const s = sayfa();
  [['tabBugun', 'bugun'], ['tabHafta', 'hafta']].forEach(([id, ad]) => {
    if (s === ad) $(id).setAttribute('aria-current', 'page'); else $(id).removeAttribute('aria-current');
  });

  $('people').innerHTML =
    '<button type="button" class="chip" data-kisi="' + TUMU + '" aria-pressed="' + (state.kisi === TUMU) + '">' + TUMU + '</button>' +
    state.kisiler.map(k => '<button type="button" class="chip" data-kisi="' + esc(k.ad) + '" aria-pressed="' + (k.ad === state.kisi) + '">' +
      nokta(k.ad) + esc(k.ad) + '</button>').join('') +
    '<button type="button" class="chip add" id="kisiBtn">+ Kişi</button>';

  $('weekLabel').textContent = haftaEtiket();
  const L = listeler();
  $('summary').innerHTML = ozet(L);

  siralayicilar.forEach(x => x.destroy());
  siralayicilar = [];
  $('content').innerHTML = s === 'hafta' ? haftaHTML(L.hafta) : bugunHTML(L);
  if (s === 'bugun' && window.Sortable) {
    $('content').querySelectorAll('.tbody[data-liste="plan"], .tbody[data-liste="tarihsiz"]').forEach(el => {
      siralayicilar.push(Sortable.create(el, {
        handle: '.handle', animation: 150, disabled: state.offline, fallbackTolerance: 3,
        onEnd: ev => { if (ev.oldIndex !== ev.newIndex) siraDegisti([...el.children].map(c => c.dataset.id)); }
      }));
    });
  }
  $('legend').innerHTML = legendHTML(s);

  $('offline').hidden = !state.offline;
  ['newBtn', 'pSave', 'pDel'].forEach(id => $(id).disabled = state.offline);
  $('pFields').disabled = state.offline;
  $('kFields').disabled = state.offline;
  if (!$('kPanel').hidden) kisiCiz();
}

// ── Sunucu ──
function anahtarSor(mesaj) {
  $('app').hidden = true;
  $('keyScreen').hidden = false;
  $('keyMsg').textContent = mesaj || 'Erişim anahtarını yaz. Bu cihazda bir kez sorulur.';
  $('keyInput').value = '';
  $('keyInput').focus();
}

async function yenile() {
  const key = lsGet(LS.key);
  if (!key) { anahtarSor(); return; }
  const no = ++state.istekNo;
  try {
    const r = await fetch(API + '?key=' + encodeURIComponent(key), { cache: 'no-store' });
    const j = await r.json();
    if (no !== state.istekNo) return;
    if (!j.ok) {
      if (j.hata === 'anahtar') { lsDel(LS.key); anahtarSor('Anahtar yanlış. Tekrar yaz.'); }
      return;
    }
    state.offline = false;
    veriUygula(j, true);
  } catch (e) {
    if (no !== state.istekNo) return;
    state.offline = true;
    ciz();
  }
}

// POST gönderir. Sunucu hata verse bile güncel veriyi döndürür; ekran onunla güncellenir.
async function gonder(govde) {
  govde.key = lsGet(LS.key);
  const r = await fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(govde)
  });
  const j = await r.json();
  if (j.hata === 'anahtar') { lsDel(LS.key); kapat(); anahtarSor('Anahtar yanlış. Tekrar yaz.'); throw Object.assign(new Error('anahtar'), { veri: j }); }
  state.istekNo++; // araya giren eski yenileme yanıtını yok say
  if (j.gorevler) veriUygula(j, true);
  if (!j.ok) throw Object.assign(new Error(j.hata || 'hata'), { veri: j });
  return j;
}
const hataMetni = e => HATA[e && e.message] || 'Kaydedilemedi. İnternet bağlantını kontrol edip tekrar dene.';

// ── Sürükleyerek sıralama ──
function siraDegisti(ids) {
  const g = ids.map(id => state.gorevler.find(x => x.id === id)).filter(Boolean);
  const degerler = g.map(x => x.sira).sort((a, b) => a - b);
  g.forEach((x, i) => { x.sira = degerler[i]; });
  lsSet(LS.data, JSON.stringify({ gorevler: state.gorevler, kisiler: state.kisiler }));
  ciz();
  gonder({ action: 'reorder', ids }).catch(() => yenile());
}

// ── Paneller ──
let sonOdak = null;

function panelAc(id) {
  sonOdak = document.activeElement;
  $('overlay').hidden = false;
  $(id).hidden = false;
  document.body.style.overflow = 'hidden';
}

function kapat() {
  ['panel', 'kPanel'].forEach(id => { $(id).hidden = true; });
  $('overlay').hidden = true;
  document.body.style.overflow = '';
  state.taslak = null;
  state.kMesaj = null;
  if (sonOdak && document.contains(sonOdak)) sonOdak.focus();
}

// Görev paneli
function yeniId() {
  return (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
}

function ac(g) {
  const t = bugunStr();
  const yeni = !g;
  const ilkKisi = state.kisi !== TUMU ? state.kisi : (state.kisiler[0] ? state.kisiler[0].ad : '');
  state.taslak = yeni
    ? { id: yeniId(), ad: '', sorumlu: ilkKisi, belirleme_tarihi: t, baslangic: '', bitis: '', bitti: false, durum: DURUMLAR[0], alt_gorevler: [], yeni: true }
    : Object.assign(normal(g), { alt_gorevler: g.alt_gorevler.map(a => ({ ...a })), yeni: false });
  const d = state.taslak;
  $('pTitle').textContent = yeni ? 'Yeni görev' : 'Görev';
  const adlar = state.kisiler.map(k => k.ad);
  if (d.sorumlu && !adlar.includes(d.sorumlu)) adlar.push(d.sorumlu);
  $('fSorumlu').innerHTML = adlar.map(k => '<option' + (k === d.sorumlu ? ' selected' : '') + '>' + esc(k) + '</option>').join('');

  $('fBel').value = d.belirleme_tarihi;

  $('fBit').value = d.bitis;

  altlariCiz();
  ['eAd', 'eSorumlu', 'eBel', 'eBas', 'eBit', 'eSave'].forEach(id => $(id).textContent = '');

  $('pDel').hidden = yeni;
  $('footNormal').hidden = false;

function altlariCiz() {

      '<button type="button" class="x" data-sil="' + i + '" aria-label="Alt görevi sil">×</button>' +

}

function minleri() {
  $('fBas').min = $('fBel').value || '';

function dogrula() {
  const ad = $('fAd').value.trim(), bel = $('fBel').value, bas = $('fBas').value, bit = $('fBit').value;
  const h = { eAd: '', eSorumlu: '', eBel: '', eBas: '', eBit: '' };
  if (!ad) h.eAd = 'Görev adı gerekli.';
  if (!$('fSorumlu').value) h.eSorumlu = 'Önce + Kişi ile bir kişi ekle.';
  if (!bel) h.eBel = 'Bu alan gerekli.';
  if (bas && bel && bas < bel) h.eBas = 'Başlangıç, belirleme tarihinden önce olamaz.';
  if (bit && bas && bit < bas) h.eBit = 'Bitiş, başlangıçtan önce olamaz.';
  else if (bit && !bas && bel && bit < bel) h.eBit = 'Bitiş, belirleme tarihinden önce olamaz.';
  return h;
}

function hatalariGoster(h, yazarken) {
  Object.keys(h).forEach(id => {
    if (yazarken && /gerekli|Önce/.test(h[id])) return; // yazarken "gerekli" uyarısıyla rahatsız etme
    $(id).textContent = h[id];
  });
}

async function kisiSil(ad) {
  try {
    await gonder({ action: 'deletePerson', ad });
    state.kMesaj = null;
  } catch (e) {
    const v = e.veri || {};
    state.kMesaj = e.message === 'acik' ? { ad, tur: 'acik', sayi: v.sayi } : null;
    if (e.message !== 'acik') $('kListErr').textContent = 'Silinemedi. İnternet bağlantını kontrol edip tekrar dene.';
  }
  kisiCiz();
}

// ── Excel ──
function kutuphane() {
  if (window.XLSX) return Promise.resolve();
  return new Promise((ok, hata) => {
    const s = document.createElement('script');
    s.src = XLSX_URL; s.onload = ok; s.onerror = hata;
    document.head.appendChild(s);
  });
}

const XR = { g: ['EAF3DE', '27500A'], b: ['E6F1FB', '0C447C'], r: ['FCEBEB', '791F1F'], k: ['F1EFE8', '444441'], we: 'F4F8FD', line: 'D3D1C7', text: '2C2C2A', text2: '5F5E5A' };
const altMetin = g => g.alt_gorevler.map(a => (a.bitti ? '✓ ' : '☐ ') + a.ad).join('\n');
const font = (renk, kalin) => ({ font: { name: 'Calibri', sz: 11, bold: !!kalin, color: { rgb: renk || XR.text } } });
const dolgu = rgb => ({ fill: { patternType: 'solid', fgColor: { rgb } } });

function hucre(v, ...stiller) {
  return {
    v: v, t: typeof v === 'number' ? 'n' : 's',
    s: Object.assign({ alignment: { vertical: 'top', wrapText: true }, border: { bottom: { style: 'thin', color: { rgb: XR.line } } } }, font(), ...stiller)
  };
}
const baslikHucre = v => hucre(v, font(XR.text2, true));

function sayfaYap(satirlar, genislik) {
  const ws = XLSX.utils.aoa_to_sheet([[]]);
  satirlar.forEach((r, ri) => r.forEach((c, ci) => { ws[XLSX.utils.encode_cell({ r: ri, c: ci })] = c; }));
  ws['!ref'] = XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: Math.max(0, satirlar.length - 1), c: genislik.length - 1 } });
  ws['!cols'] = genislik.map(w => ({ wch: w }));
  return ws;
}

// Liste sayfası: Bugün, Tarihsiz, Biten
function listeSayfasi(list) {
  const s = [['Sıra', 'Bitiş', 'Gün', 'Görev', 'Sorumlu', 'Talimat', 'Gerekçe', 'Alt görevler'].map(baslikHucre)];
  list.forEach((g, i) => {
    const e = etiket(g), we = g.bitis && haftaSonu(g.bitis) ? dolgu(XR.we) : {};
    s.push([
      hucre(i + 1, we), hucre(g.bitis ? kisaTarih(g.bitis) : '—', we), hucre(g.bitis ? gunAdi(g.bitis) : '', we),
      hucre(g.ad, we), hucre(g.sorumlu, we),
      hucre(e.ad, dolgu(XR[e.cls][0]), font(XR[e.cls][1], true)),
      hucre(e.neden, we), hucre(altMetin(g), we)
    ]);
  });
  return sayfaYap(s, [6, 10, 12, 40, 16, 12, 28, 40]);
}

// Başlık satırını sabitle: SheetJS ücretsiz sürümü bölme yazmadığı için XML'e eklenir.
function baslikSabitle(buf) {
  try {
    const cfb = XLSX.CFB.read(new Uint8Array(buf), { type: 'array' });
    cfb.FullPaths.forEach((p, i) => {
      if (!/xl\/worksheets\/sheet\d+\.xml$/.test(p)) return;
      const f = cfb.FileIndex[i];
      const xml = new TextDecoder().decode(new Uint8Array(f.content));
      const yeni = xml.replace(/<sheetView ([^>]*?)\/>/, '<sheetView $1><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView>');
      const bayt = new TextEncoder().encode(yeni);
      f.content = bayt; f.size = bayt.length;
    });
    return XLSX.CFB.write(cfb, { type: 'array', fileType: 'zip', compression: true });
  } catch (e) {
    return buf;
  }
}

async function excel() {
  const msg = $('exportMsg');
  msg.hidden = true;
  try { await kutuphane(); } catch (e) {
    msg.textContent = 'Excel için internet gerekli (ilk kullanımda).'; msg.hidden = false; return;
  }
  const L = listeler(), pzt = state.hafta;

  // Hafta sayfası
  const gunler = [...Array(7)].map((_, i) => gunEkle(pzt, i));
  const s2 = [['Sıra', 'Görev', 'Sorumlu', ...gunler.map(d => toDate(d).getDate() + ' ' + KISA_GUN[toDate(d).getDay()]), 'Alt görevler'].map(baslikHucre)];
  L.hafta.forEach((g, i) => {
    const p = serit(g), r = RENK[kisiRengi(g.sorumlu)];
    const gunHucre = gunler.map((d, j) => (j >= p.s && j <= p.e)
      ? hucre(j === p.s ? g.ad : '', dolgu(r[0]), font(r[1]))
      : hucre('', haftaSonu(d) ? dolgu(XR.we) : {}));
    s2.push([hucre(i + 1), hucre(g.ad), hucre(g.sorumlu), ...gunHucre, hucre(altMetin(g))]);
  });

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, listeSayfasi(L.plan), 'Bugün');
  XLSX.utils.book_append_sheet(wb, sayfaYap(s2, [6, 40, 16, 12, 12, 12, 12, 12, 12, 12, 40]), 'Hafta');
  XLSX.utils.book_append_sheet(wb, listeSayfasi(L.tarihsiz), 'Tarihsiz');
  XLSX.utils.book_append_sheet(wb, listeSayfasi(L.bitenTum), 'Biten');
  const buf = baslikSabitle(XLSX.write(wb, { bookType: 'xlsx', type: 'array' }));
  const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'UTE-eylem-plani-' + pzt + '.xlsx';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
